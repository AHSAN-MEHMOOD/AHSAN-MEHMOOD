name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub stats and generate SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os

          username = "AHSAN-MEHMOOD"
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"bearer {token}",
              "Content-Type": "application/json"
          }

          # GraphQL query to get stats
          query = """
          {
            user(login: "%s") {
              name
              repositories(first: 100, ownerAffiliations: OWNER, isFork: false) {
                nodes {
                  stargazerCount
                  primaryLanguage { name color }
                  languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                    edges { size node { name color } }
                  }
                }
              }
              contributionsCollection(from: "2026-01-01T00:00:00Z", to: "2026-12-31T23:59:59Z") {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                contributionCalendar { totalContributions }
              }
              followers { totalCount }
              following { totalCount }
            }
          }
          """ % username

          data = json.dumps({"query": query}).encode()
          req = urllib.request.Request("https://api.github.com/graphql", data=data, headers=headers)
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())

          user = result["data"]["user"]
          contrib = user["contributionsCollection"]
          repos = user["repositories"]["nodes"]

          total_stars = sum(r["stargazerCount"] for r in repos)
          commits_2026 = contrib["totalCommitContributions"]
          prs = contrib["totalPullRequestContributions"]
          issues = contrib["totalIssueContributions"]
          total_2026 = contrib["contributionCalendar"]["totalContributions"]

          # Count languages
          lang_sizes = {}
          for repo in repos:
              for edge in repo["languages"]["edges"]:
                  name = edge["node"]["name"]
                  color = edge["node"]["color"] or "#ccc"
                  lang_sizes[name] = lang_sizes.get(name, {"size": 0, "color": color})
                  lang_sizes[name]["size"] += edge["size"]

          top_langs = sorted(lang_sizes.items(), key=lambda x: x[1]["size"], reverse=True)[:6]
          total_size = sum(v["size"] for _, v in top_langs) or 1

          os.makedirs("profile-summary-card-output", exist_ok=True)

          # Save contribs.json
          with open("contribs.json", "w") as f:
              json.dump({"total": total_2026, "year": 2026}, f)

          # --- STATS CARD SVG ---
          stats_svg = f"""<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
            <style>
              .bg {{ fill: #1a1b27; rx: 10; }}
              .title {{ fill: #70a5fd; font-family: 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; }}
              .label {{ fill: #a9b1d6; font-family: 'Segoe UI', sans-serif; font-size: 13px; }}
              .value {{ fill: #ffffff; font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; }}
              .icon {{ fill: #70a5fd; }}
            </style>
            <rect width="495" height="195" rx="10" fill="#1a1b27"/>
            <text x="25" y="35" class="title">📊 Ahsan's GitHub Stats (2026)</text>
            <text x="25" y="75" class="label">⭐ Total Stars Earned:</text>
            <text x="300" y="75" class="value">{total_stars}</text>
            <text x="25" y="100" class="label">🔨 Commits (2026):</text>
            <text x="300" y="100" class="value">{commits_2026}</text>
            <text x="25" y="125" class="label">🔀 Pull Requests:</text>
            <text x="300" y="125" class="value">{prs}</text>
            <text x="25" y="150" class="label">🐛 Issues:</text>
            <text x="300" y="150" class="value">{issues}</text>
            <text x="25" y="175" class="label">🗓️ Total Contributions (2026):</text>
            <text x="300" y="175" class="value">{total_2026}</text>
          </svg>"""

          # --- LANGUAGES CARD SVG ---
          bar_x = 25
          bar_y = 120
          bar_w = 445
          bar_h = 8
          bars = ""
          cx = bar_x
          for name, info in top_langs:
              w = int((info["size"] / total_size) * bar_w)
              bars += f'<rect x="{cx}" y="{bar_y}" width="{w}" height="{bar_h}" rx="4" fill="{info["color"]}"/>'
              cx += w

          legend = ""
          for i, (name, info) in enumerate(top_langs):
              lx = 25 + (i % 3) * 155
              ly = 145 + (i // 3) * 22
              pct = round((info["size"] / total_size) * 100, 1)
              legend += f'<circle cx="{lx+6}" cy="{ly-4}" r="5" fill="{info["color"]}"/>'
              legend += f'<text x="{lx+16}" y="{ly}" fill="#a9b1d6" font-family="Segoe UI,sans-serif" font-size="12">{name} {pct}%</text>'

          langs_svg = f"""<svg width="495" height="205" viewBox="0 0 495 205" xmlns="http://www.w3.org/2000/svg">
            <rect width="495" height="205" rx="10" fill="#1a1b27"/>
            <text x="25" y="35" fill="#70a5fd" font-family="Segoe UI,sans-serif" font-size="17" font-weight="700">💻 Most Used Languages</text>
            <text x="25" y="75" fill="#a9b1d6" font-family="Segoe UI,sans-serif" font-size="12">Based on repository code size</text>
            {bars}
            {legend}
          </svg>"""

          with open("profile-summary-card-output/stats.svg", "w") as f:
              f.write(stats_svg)
          with open("profile-summary-card-output/langs.svg", "w") as f:
              f.write(langs_svg)

          print(f"Done! Stars={total_stars}, Commits={commits_2026}, 2026 Total={total_2026}")
          PYEOF

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/ contribs.json
          git diff --staged --quiet || git commit -m "chore: update stats cards [skip ci]"
          git push
